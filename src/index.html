<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Leo Woodcrafts — Furniture Business Manager</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="brand-wrapper">
          <div class="brand-icon">🪑</div>
          <div>
            <div class="brand-title">LEO WOODCRAFTS</div>
            <div class="brand-subtitle">Local Furniture Management System</div>
          </div>
        </div>

        <nav class="nav-tabs" id="app-nav">
          <button class="nav-btn active" data-view="dashboard">
            <span>📊</span> Dashboard
          </button>
          <button class="nav-btn" data-view="orders">
            <span>📦</span> Orders & Quotes
          </button>
          <button class="nav-btn" data-view="clients">
            <span>👥</span> Clients CRM
          </button>
          <button class="nav-btn" data-view="products">
            <span>🪵</span> Catalog
          </button>
          <button class="nav-btn" data-view="settings">
            <span>⚙️</span> Settings
          </button>
        </nav>
      </div>
    </header>

    <!-- Main View Container -->
    <main class="main-container" id="main-view">
      <!-- Dynamically rendered view goes here -->
    </main>

    <!-- Global Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
